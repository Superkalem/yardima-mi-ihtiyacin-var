<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Aracını ekle | Yardıma mı ihtiyacın var? | Shell</title>
  <link rel="icon" href="img/shell-pecten.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-logo"><img src="img/shell-pecten.svg" alt="Shell"></div>
    <div class="loader-bar"></div>
    <p class="loader-text"></p>
  </div>
  <noscript><style>.loader { display: none; }</style></noscript>

  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo">
        <img src="img/shell-pecten.svg" alt="Shell">
        <span>Yardıma mı ihtiyacın var?</span>
      </a>
      <a href="garaj.html" class="garage-btn" id="garageBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-8h10v8M7 17h10"/></svg>
        <span>Garajım</span>
      </a>
    </div>
  </header>

  <main class="page page-picker">
    <section class="picker">
      <div class="picker-head">
        <h1>Aracını seç</h1>
        <p class="sub">Uygun Shell yağını ve antifrizi gösterelim.</p>
      </div>

      <div class="car-stage" id="carPreview"></div>

      <div class="form picker-form">
        <div class="field" id="stepBrand">
          <span class="field-label">Marka</span>
          <div class="dd" id="ddBrand">
            <button type="button" class="dd-field" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-value">Marka seçin</span>
              <svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dd-panel"><div class="dd-inner"><div class="dd-list" role="listbox"></div></div></div>
          </div>
        </div>

        <div class="field locked" id="stepModel">
          <span class="field-label">Model</span>
          <div class="dd" id="ddModel">
            <button type="button" class="dd-field" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-value">Model seçin</span>
              <svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dd-panel"><div class="dd-inner"><div class="dd-list" role="listbox"></div></div></div>
          </div>
        </div>

        <div class="field locked" id="stepFuel">
          <span class="field-label">Yakıt</span>
          <div class="dd" id="ddFuel">
            <button type="button" class="dd-field" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-value">Yakıt seçin</span>
              <svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dd-panel"><div class="dd-inner"><div class="dd-list" role="listbox"></div></div></div>
          </div>
        </div>

        <div class="field locked" id="stepYear">
          <span class="field-label">Model yılı</span>
          <div class="dd" id="ddYear">
            <button type="button" class="dd-field" aria-haspopup="listbox" aria-expanded="false">
              <span class="dd-value">Yıl seçin</span>
              <svg class="dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dd-panel"><div class="dd-inner"><div class="dd-list" role="listbox"></div></div></div>
          </div>
        </div>

        <div class="field locked" id="stepKm">
          <div class="km-head">
            <label class="field-label" for="kmRange">Kilometre</label>
            <span class="km-value"><span id="kmValue">60.000</span> km</span>
          </div>
          <input type="range" id="kmRange" min="0" max="400000" step="5000" value="60000">
          <div class="km-scale"><span>0</span><span>200.000</span><span>400.000+</span></div>
        </div>
      </div>

      <button type="button" class="btn btn-red btn-block" id="showBtn" disabled>
        Göster
      </button>
    </section>

    <section class="result" id="result" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <img src="img/shell-pecten.svg" alt="Shell">
      <nav class="footer-links">
        <a href="https://www.shell.com.tr" target="_blank" rel="noopener">Shell Türkiye</a>
        <a href="https://lubematch.shell.com" target="_blank" rel="noopener">Shell LubeMatch</a>
      </nav>
      <p>Öneriler genel üretici normlarına dayanır. Kesin bilgi için aracının kullanım kılavuzuna bakın.</p>
    </div>
  </footer>

  <script src="js/cars.js"></script>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/car-photo.js"></script>
  <script src="js/ekle.js"></script>
</body>
</html>
